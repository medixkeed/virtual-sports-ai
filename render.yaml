services:
  - type: web
    name: virtual-sports-ai-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATA_PROVIDER
        value: betpawa
      - key: HISTORICAL_SEASON_COUNT
        value: "9"
      - key: REFRESH_INTERVAL_MINUTES
        value: "5"
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: virtual-sports-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false