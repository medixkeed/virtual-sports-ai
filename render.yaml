services:
  - type: web
    name: virtual-sports-ai-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATA_PROVIDER
        value: betpawa
      - key: HISTORICAL_SEASON_COUNT
        value: "9"
      - key: REFRESH_INTERVAL_MINUTES
        value: "5"
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: virtual-sports-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false